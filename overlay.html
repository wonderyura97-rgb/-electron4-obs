<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4인 전자녀 OBS</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#stage{position:relative;width:1920px;height:1080px;transform-origin:top left}.slot{position:absolute;overflow:visible;pointer-events:none}.slot iframe{width:100%;height:100%;border:0;background:transparent;pointer-events:none}#status{position:absolute;left:12px;top:12px;color:#fff;background:#34245b;padding:6px 10px;border-radius:6px;font:14px sans-serif;display:none}</style></head><body><div id="stage"><div id="status"></div></div><script src="config.js"></script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getDatabase,ref,onValue} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
const stage=document.getElementById('stage'),status=document.getElementById('status');
const resize=()=>{stage.style.transform=`scale(${innerWidth/1920},${innerHeight/1080})`};addEventListener('resize',resize);resize();
const params=new URLSearchParams(location.search), room=params.get('room')||'main';
const config=window.FIREBASE_CONFIG;
if(!config?.apiKey||!config?.databaseURL){status.textContent='config.js 설정이 필요합니다';status.style.display='block';}else{
const db=getDatabase(initializeApp(config));let nodes=[];
onValue(ref(db,'rooms/'+room+'/layout'),snapshot=>{const data=snapshot.val()||{}, slots=Array.isArray(data.slots)?data.slots:[];for(let i=0;i<4;i++){const s=slots[i]||{},url=(s.url||'').trim();let node=nodes[i];if(!node){node=document.createElement('div');node.className='slot';const frame=document.createElement('iframe');frame.setAttribute('allow','autoplay');node.append(frame);stage.append(node);nodes[i]=node;}node.style.left=(Number(s.x)??0)+'px';node.style.top=(Number(s.y)??0)+'px';node.style.width=Math.max(1,Number(s.w)||320)+'px';node.style.height=Math.max(1,Number(s.h)||300)+'px';node.style.display=url?'block':'none';const frame=node.firstElementChild;if(frame.dataset.url!==url){frame.dataset.url=url;if(url)frame.src=url;else frame.removeAttribute('src');}}status.style.display='none';},e=>{status.textContent='설정을 읽을 수 없습니다: '+e.message;status.style.display='block';});
}
</script></body></html>
